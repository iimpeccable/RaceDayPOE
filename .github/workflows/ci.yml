name: RaceDay CI Workflow

on:
  push:
    branches: [ "main", "master", "feature/*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # --- Part 1 Checks ---
    - name: Verify /docs directory exists
      run: |
        if [ ! -d "docs" ]; then
          echo "Error: /docs directory missing!"
          exit 1
        fi

    # --- Part 2 .NET Setup ---
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    # --- Restore & Build API ---
    - name: Restore API dependencies
      run: dotnet restore RaceDay.API/RaceDay.API.csproj

    - name: Build API Project
      run: dotnet build RaceDay.API/RaceDay.API.csproj --no-restore --configuration Release

    # --- Restore & Run Tests ---
    - name: Restore Test dependencies
      run: dotnet restore RaceDay.Tests/RaceDay.Tests.csproj

    - name: Run Unit Tests
      run: dotnet test RaceDay.Tests/RaceDay.Tests.csproj --configuration Release --verbosity normal
