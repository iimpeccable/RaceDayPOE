name: RaceDay CI Workflow

on:
  push:
    branches: [ "main", "master", "feature/*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # --- Part 1 Checks ---
    - name: Verify /docs directory exists
      run: |
        if [ ! -d "docs" ]; then
          echo "Error: /docs directory missing!"
          exit 1
        fi

    # --- Part 2 .NET Build & Unit Tests ---
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore RaceDay.API/RaceDay.API.slnx

    - name: Build Solution
      run: dotnet build RaceDay.API/RaceDay.API.slnx --no-restore --configuration Release

    - name: Run Unit Tests
      run: dotnet test RaceDay.API/RaceDay.API.slnx --no-build --verbosity normal
